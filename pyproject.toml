[project]
name = "robot-catcher"
version = "0.1.0"
description = "Learning ball trajectories in general room geometries for robotic catching"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy",
    "matplotlib",
    "torch>=2.14.1",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["webapp"]
